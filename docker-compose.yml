# Presentify — self-hosted stack
#
#   First time:   run scripts/setup.ps1 (Windows) or scripts/setup.sh (Linux) to create .env
#   Start:        docker compose up -d --build
#   Stop:         docker compose down
#   Super Admin:  docker compose run --rm tools create-superadmin
#
# This is a trimmed version of the official self-hosted Supabase stack
# (https://supabase.com/docs/guides/self-hosting/docker). Presentify uses only:
# Postgres, Auth, REST, Storage and Edge Functions. The "web" service is nginx:
# it serves the Presentify screens and is the single entry point (gateway) to
# the Supabase services. Nothing else is published on the network.

name: ${COMPOSE_PROJECT_NAME:-presentify}

x-restart: &restart
  restart: unless-stopped

services:
  db:
    <<: *restart
    image: supabase/postgres:17.6.1.136
    volumes:
      - ./docker/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./docker/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?run the setup script first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY:-900}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]

  auth:
    <<: *restart
    image: supabase/gotrue:v2.196.0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_URL}/**
      # Accounts are created only by administrators — never by public sign-up.
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-900}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${PUBLIC_URL}/auth/v1
      # Password policy: at least 10 characters with lower case, upper case and a digit.
      GOTRUE_PASSWORD_MIN_LENGTH: 10
      GOTRUE_PASSWORD_REQUIRED_CHARACTERS: "abcdefghijklmnopqrstuvwxyz:ABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789"
      # Sessions end after inactivity and after a maximum lifetime.
      GOTRUE_SESSIONS_INACTIVITY_TIMEOUT: ${SESSION_INACTIVITY_TIMEOUT:-30m}
      GOTRUE_SESSIONS_TIMEBOX: ${SESSION_MAX_LIFETIME:-12h}
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      # Authenticator-app MFA.
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: 3
      # Presentify database hooks: role/organisation claims, deactivation checks,
      # failed-login lockout and MFA lockout.
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: "pg-functions://postgres/app/custom_access_token_hook"
      GOTRUE_HOOK_PASSWORD_VERIFICATION_ATTEMPT_ENABLED: "true"
      GOTRUE_HOOK_PASSWORD_VERIFICATION_ATTEMPT_URI: "pg-functions://postgres/app/password_verification_hook"
      GOTRUE_HOOK_MFA_VERIFICATION_ATTEMPT_ENABLED: "true"
      GOTRUE_HOOK_MFA_VERIFICATION_ATTEMPT_URI: "pg-functions://postgres/app/mfa_verification_hook"
      # Optional e-mail server (password-reset e-mails). Leave SMTP_HOST empty to disable.
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Presentify}
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

  rest:
    <<: *restart
    image: postgrest/postgrest:v14.17
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-900}
      # The API description is available only to signed-in staff (see web/nginx).
      PGRST_OPENAPI_MODE: follow-privileges
    command: ["postgrest"]

  storage:
    <<: *restart
    image: supabase/storage-api:v1.74.0
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://storage:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: ${PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      # Absolute ceiling per file; each organisation's own limit is lower and is enforced by Presentify.
      FILE_SIZE_LIMIT: 524288000
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: presentify
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: presentify
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage

  functions:
    <<: *restart
    image: supabase/edge-runtime:v1.76.2
    depends_on:
      rest:
        condition: service_healthy
      auth:
        condition: service_healthy
    volumes:
      - ./supabase/functions:/home/deno/functions:ro
      - deno-cache:/root/.cache/deno
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: http://web:8080
      SUPABASE_PUBLIC_URL: ${PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      VERIFY_JWT: "true"
    command: ["start", "--user-worker-request-idle-timeout", "150000", "--main-service", "/home/deno/functions/main"]

  # Applies the Presentify database migrations, then exits.
  migrate:
    image: presentify-tools:local
    build:
      context: ./tools
      additional_contexts:
        certs: ./docker/certs
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    volumes:
      - ./supabase/migrations:/migrations:ro
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      MIGRATIONS_DIR: /migrations
    command: ["migrate"]

  # Presentify screens + gateway to the Supabase services (the only published port).
  web:
    <<: *restart
    image: presentify-web:local
    build:
      context: ./web
      additional_contexts:
        certs: ./docker/certs
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
      storage:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      ANON_KEY: ${ANON_KEY}
      PUBLIC_URL: ${PUBLIC_URL}
      TEST_MODE: ${TEST_MODE:-true}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      # Screens sign out after this long without mouse/keyboard use (same as the server's limit).
      SESSION_INACTIVITY_TIMEOUT: ${SESSION_INACTIVITY_TIMEOUT:-30m}
      # Sign-in attempts allowed per minute from one device/IP address.
      SIGNIN_RATE_PER_MINUTE: ${SIGNIN_RATE_PER_MINUTE:-30}
      # Participant requests allowed per second from one address (a whole venue may share one).
      PUBLIC_RATE_PER_SECOND: ${PUBLIC_RATE_PER_SECOND:-100}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Administrative commands, e.g.: docker compose run --rm tools create-superadmin
  tools:
    image: presentify-tools:local
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_URL: http://auth:9999
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./supabase/migrations:/migrations:ro

volumes:
  db-data:
  db-config:
  storage-data:
  deno-cache:
